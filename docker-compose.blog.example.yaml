services:
  blog:
    build:
      context: ./blog
      args:
        HUGO_VERSION: 0.164.0
        HUGO_SHA256: 87bf5db4230dc9c4e41bf4d77ac9d06220265ce21f6e3126886edd32f21a41dc
    command:
      - server
      - --bind
      - 0.0.0.0
      - --port
      - "1313"
      - --environment
      - production
      - --disableLiveReload
      - --noBuildLock
    volumes:
      - ./blog/bloghome:/srv
    ports:
      - "1313:1313"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal

networks:
  internal:
    external: true
