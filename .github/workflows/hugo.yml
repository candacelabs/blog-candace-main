name: Hugo checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Verify LFS assets
        run: ./scripts/check-lfs-assets.sh

      - name: Install privacy scanner
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Build pinned Hugo image
        run: docker build --tag candace-blog:ci .

      - name: Build production site
        run: |
          mkdir -p bloghome/public
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${{ github.workspace }}/bloghome:/srv" \
            candace-blog:ci \
            --minify --gc --cleanDestinationDir --panicOnWarning \
            --printPathWarnings --destination /srv/public

      - name: Check public privacy boundary
        run: ./scripts/check-public-content.sh bloghome/public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: https://blog.candace.cloud/
    concurrency:
      group: blog-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          BLOG_DEPLOY_HOST: ${{ vars.BLOG_DEPLOY_HOST }}
          BLOG_DEPLOY_USER: ${{ vars.BLOG_DEPLOY_USER }}
          BLOG_DEPLOY_KNOWN_HOSTS: ${{ secrets.BLOG_DEPLOY_KNOWN_HOSTS }}
          BLOG_DEPLOY_SSH_KEY: ${{ secrets.BLOG_DEPLOY_SSH_KEY }}
          CANDACE_SERVER_SYNC_APP_CLIENT_ID: ${{ vars.CANDACE_SERVER_SYNC_APP_CLIENT_ID }}
          CANDACE_SERVER_SYNC_APP_PRIVATE_KEY: ${{ secrets.CANDACE_SERVER_SYNC_APP_PRIVATE_KEY }}
          CANDACE_SERVER_SYNC_OWNER: ${{ vars.CANDACE_SERVER_SYNC_OWNER }}
          CANDACE_SERVER_SYNC_REPOSITORY: ${{ vars.CANDACE_SERVER_SYNC_REPOSITORY }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail
          for name in \
            BLOG_DEPLOY_HOST \
            BLOG_DEPLOY_USER \
            BLOG_DEPLOY_KNOWN_HOSTS \
            BLOG_DEPLOY_SSH_KEY \
            CANDACE_SERVER_SYNC_APP_CLIENT_ID \
            CANDACE_SERVER_SYNC_APP_PRIVATE_KEY \
            CANDACE_SERVER_SYNC_OWNER \
            CANDACE_SERVER_SYNC_REPOSITORY \
            TS_AUDIENCE \
            TS_OAUTH_CLIENT_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing production environment setting: ${name}" >&2
              exit 2
            fi
          done
          if [[ "${BLOG_DEPLOY_USER}" != "blogdeploy" ]]; then
            echo "BLOG_DEPLOY_USER must be the constrained blogdeploy account." >&2
            exit 2
          fi
          if [[ ! "${BLOG_DEPLOY_HOST}" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "BLOG_DEPLOY_HOST must be a single safe MagicDNS label." >&2
            exit 2
          fi

      - name: Verify release LFS assets
        run: ./scripts/check-lfs-assets.sh

      - name: Install privacy scanner
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Build and scan exact release
        run: |
          docker build --tag candace-blog:hugo .
          mkdir -p bloghome/public
          docker run --rm \
            --env "HUGO_PARAMS_RELEASESHA=${GITHUB_SHA}" \
            --user "$(id -u):$(id -g)" \
            --volume "${{ github.workspace }}/bloghome:/srv" \
            candace-blog:hugo \
            --minify --gc --cleanDestinationDir --panicOnWarning \
            --printPathWarnings --destination /srv/public
          ./scripts/check-public-content.sh bloghome/public
          grep --fixed-strings "candace-release" bloghome/public/index.html
          grep --fixed-strings "${GITHUB_SHA}" bloghome/public/index.html

      - name: Build and smoke-test runtime image
        run: |
          set -euo pipefail
          runtime_image="candace-blog:${GITHUB_SHA}"
          candidate="candace-blog-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "${candidate}" >/dev/null 2>&1 || true' EXIT

          docker build \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --file deploy/Dockerfile \
            --tag "${runtime_image}" \
            bloghome/public
          docker run \
            --detach \
            --name "${candidate}" \
            --read-only \
            --tmpfs /config:rw,noexec,nosuid,nodev,size=1m \
            --tmpfs /data:rw,noexec,nosuid,nodev,size=1m \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=4m \
            --pids-limit 128 \
            --memory 128m \
            --cpus 0.5 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            "${runtime_image}"

          for attempt in $(seq 1 30); do
            health="$(docker inspect --format \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              "${candidate}")"
            if [[ "${health}" == "healthy" ]]; then
              break
            fi
            if [[ "${health}" == "unhealthy" || "${attempt}" -eq 30 ]]; then
              docker logs "${candidate}"
              exit 1
            fi
            sleep 1
          done

          docker exec "${candidate}" \
            wget --quiet --output-document=/tmp/homepage http://127.0.0.1:8080/
          docker exec "${candidate}" grep -F "${GITHUB_SHA}" /tmp/homepage
          docker exec "${candidate}" \
            wget --quiet --output-document=/tmp/og.png http://127.0.0.1:8080/og.png
          test "$(docker exec "${candidate}" stat -c %s /tmp/og.png)" -gt 100000

          docker save "${runtime_image}" | gzip --best > \
            "${RUNNER_TEMP}/candace-blog-${GITHUB_SHA}.tar.gz"

      - name: Confirm this release is still main
        id: freshness
        run: |
          set -euo pipefail
          main_sha="$(
            git ls-remote --exit-code \
              https://github.com/candacelabs/blog-candace-main.git \
              refs/heads/main |
              cut -f 1
          )"
          if [[ ! "${main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve a valid main revision." >&2
            exit 1
          fi
          if [[ "${main_sha}" == "${GITHUB_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping superseded release ${GITHUB_SHA}."
          fi

      - name: Create the server synchronization token
        id: server-sync-token
        if: steps.freshness.outputs.current == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CANDACE_SERVER_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.CANDACE_SERVER_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ vars.CANDACE_SERVER_SYNC_OWNER }}
          repositories: ${{ vars.CANDACE_SERVER_SYNC_REPOSITORY }}
          permission-actions: write

      - name: Record release in candace-server main
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ steps.server-sync-token.outputs.token }}
          SERVER_SYNC_OWNER: ${{ vars.CANDACE_SERVER_SYNC_OWNER }}
          SERVER_SYNC_REPOSITORY: ${{ vars.CANDACE_SERVER_SYNC_REPOSITORY }}
        run: |
          set -euo pipefail
          if [[ ! "${SERVER_SYNC_OWNER}" =~ ^[A-Za-z0-9-]+$ ||
            ! "${SERVER_SYNC_REPOSITORY}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "The server synchronization target is invalid." >&2
            exit 2
          fi
          readonly server_repository="${SERVER_SYNC_OWNER}/${SERVER_SYNC_REPOSITORY}"
          readonly workflow="sync-blog-submodule.yml"

          run_id="$(
            gh api \
              --method POST \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${server_repository}/actions/workflows/${workflow}/dispatches" \
              --field ref=main \
              --field "inputs[blog_sha]=${GITHUB_SHA}" \
              --field return_run_details=true \
              --jq .workflow_run_id
          )"
          if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
            echo "GitHub did not return the synchronization run ID." >&2
            exit 1
          fi

          sync_succeeded=false
          for poll_attempt in $(seq 1 120); do
            read -r run_status run_conclusion < <(
              gh api \
                "repos/${server_repository}/actions/runs/${run_id}" \
                --jq '[.status, (.conclusion // "none")] | @tsv'
            )
            if [[ "${run_status}" == "completed" ]]; then
              if [[ "${run_conclusion}" == "success" ]]; then
                sync_succeeded=true
                break
              fi
              echo "Server synchronization concluded ${run_conclusion}." >&2
              exit 1
            fi
            case "${run_status}" in
              in_progress | pending | queued | requested | waiting) ;;
              *)
                echo "Unexpected synchronization status: ${run_status}" >&2
                exit 1
                ;;
            esac
            if ((poll_attempt % 12 == 0)); then
              echo "Waiting for server synchronization (${poll_attempt}/120)."
            fi
            sleep 5
          done
          if [[ "${sync_succeeded}" != "true" ]]; then
            echo "Timed out waiting for server synchronization." >&2
            exit 1
          fi

      - name: Join the deployment network
        if: steps.freshness.outputs.current == 'true'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:blog-deploy
          ping: ${{ vars.BLOG_DEPLOY_HOST }}

      - name: Confirm synchronized release is still main
        id: release-freshness
        if: steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          main_sha="$(
            git ls-remote --exit-code \
              https://github.com/candacelabs/blog-candace-main.git \
              refs/heads/main |
              cut -f 1
          )"
          if [[ ! "${main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve a valid main revision." >&2
            exit 1
          fi
          if [[ "${main_sha}" == "${GITHUB_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping superseded release ${GITHUB_SHA}."
          fi

      - name: Deploy through the constrained host command
        id: deploy
        if: steps.release-freshness.outputs.current == 'true'
        env:
          BLOG_DEPLOY_HOST: ${{ vars.BLOG_DEPLOY_HOST }}
          BLOG_DEPLOY_KNOWN_HOSTS: ${{ secrets.BLOG_DEPLOY_KNOWN_HOSTS }}
          BLOG_DEPLOY_SSH_KEY: ${{ secrets.BLOG_DEPLOY_SSH_KEY }}
          BLOG_DEPLOY_USER: ${{ vars.BLOG_DEPLOY_USER }}
          DEPLOY_ATTEMPT_INPUT: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/blog-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/blog-known-hosts"
          install -m 600 /dev/null "${key_file}"
          install -m 600 /dev/null "${known_hosts_file}"
          printf '%s\n' "${BLOG_DEPLOY_SSH_KEY}" > "${key_file}"
          printf '%s\n' "${BLOG_DEPLOY_KNOWN_HOSTS}" > "${known_hosts_file}"
          ssh-keygen -y -f "${key_file}" >/dev/null

          archive="${RUNNER_TEMP}/candace-blog-${GITHUB_SHA}.tar.gz"
          archive_sha="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
          deploy_attempt="$(
            printf '%s\n' "${DEPLOY_ATTEMPT_INPUT}" |
              sha256sum |
              cut -d ' ' -f 1
          )"
          [[ "${deploy_attempt}" =~ ^[0-9a-f]{64}$ ]]
          ssh_options=(
            -i "${key_file}"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o ServerAliveCountMax=40
            -o ServerAliveInterval=15
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts_file}"
          )

          echo "attempted=true" >> "${GITHUB_OUTPUT}"
          echo "attempt=${deploy_attempt}" >> "${GITHUB_OUTPUT}"
          ssh -T "${ssh_options[@]}" \
            "${BLOG_DEPLOY_USER}@${BLOG_DEPLOY_HOST}" \
            "deploy ${GITHUB_SHA} ${archive_sha} ${deploy_attempt}" < "${archive}"

      - name: Verify the public release
        if: steps.release-freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          live_page="${RUNNER_TEMP}/live-homepage"
          curl --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 --max-time 15 \
            "https://blog.candace.cloud/?release=${GITHUB_SHA}" \
            --output "${live_page}"
          grep --fixed-strings "candace-release" "${live_page}"
          grep --fixed-strings "${GITHUB_SHA}" "${live_page}"

      - name: Roll back a release that failed public verification
        if: (failure() || cancelled()) && steps.deploy.outputs.attempted == 'true'
        env:
          BLOG_DEPLOY_HOST: ${{ vars.BLOG_DEPLOY_HOST }}
          BLOG_DEPLOY_KNOWN_HOSTS: ${{ secrets.BLOG_DEPLOY_KNOWN_HOSTS }}
          BLOG_DEPLOY_SSH_KEY: ${{ secrets.BLOG_DEPLOY_SSH_KEY }}
          BLOG_DEPLOY_USER: ${{ vars.BLOG_DEPLOY_USER }}
          DEPLOY_ATTEMPT: ${{ steps.deploy.outputs.attempt }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/blog-deploy-key"
          known_hosts_file="${RUNNER_TEMP}/blog-known-hosts"
          install -m 600 /dev/null "${key_file}"
          install -m 600 /dev/null "${known_hosts_file}"
          printf '%s\n' "${BLOG_DEPLOY_SSH_KEY}" > "${key_file}"
          printf '%s\n' "${BLOG_DEPLOY_KNOWN_HOSTS}" > "${known_hosts_file}"
          ssh-keygen -y -f "${key_file}" >/dev/null
          [[ "${DEPLOY_ATTEMPT}" =~ ^[0-9a-f]{64}$ ]]

          ssh -T -n \
            -i "${key_file}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=40 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=${known_hosts_file}" \
            "${BLOG_DEPLOY_USER}@${BLOG_DEPLOY_HOST}" \
            "rollback ${GITHUB_SHA} ${DEPLOY_ATTEMPT}"
